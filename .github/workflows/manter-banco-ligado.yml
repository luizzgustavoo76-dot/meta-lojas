name: Manter o banco ligado
# O Supabase (plano grátis) pausa o banco depois de ~7 dias sem acesso.
# Este agendamento faz um acesso simples todo dia, sem ler nenhum dado da loja.
on:
  schedule:
    - cron: "17 10 * * *"   # todo dia às 07:17 (horário de Brasília)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acessar o banco
        run: |
          URL=$(grep -oP "url: '\K[^']+" <<< "$(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/config.js)")
          KEY=$(grep -oP "anonKey: '\K[^']+" <<< "$(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/config.js)")
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/setores?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Resposta do banco: $code"
          test "$code" -lt 500
